variables:
  imageRepository: ci-cd-demo
  dockerHubUser: hiteshsingla02
  imageTag: $(Build.BuildId)

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: ci-cd-demo
  dockerHubUser: hiteshsingla02
  tag: $(Build.BuildId)

steps:

# Checkout source
- checkout: self

# Install .NET
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: '10.x'

# Restore
- script: dotnet restore
  displayName: Restore Packages

# Build
- script: dotnet build --configuration Release --no-restore
  displayName: Build Project

# Login DockerHub
- task: Docker@2
  displayName: Login DockerHub
  inputs:
    command: login
    containerRegistry: DockerHubConnection

# Build Image
- task: Docker@2
  displayName: Build Image
  inputs:
    command: build
    repository: $(dockerHubUser)/$(imageRepository)
    Dockerfile: '**/Dockerfile'
    tags: |
      latest
      $(tag)

# Push Image
- task: Docker@2
  displayName: Push Image
  inputs:
    command: push
    repository: $(dockerHubUser)/$(imageRepository)
    tags: |
      latest
      $(tag)

# Replace the placeholder in deployment.yaml
- script: |
    sed -i "s/<IMAGE_TAG>/$(imageTag)/g" k8s/deployment.yaml
  displayName: Replace Image Tag

# Deploy to AKS
- task: KubernetesManifest@1
  displayName: Deploy to AKS
  inputs:
    action: deploy
    kubernetesServiceConnection: AKS-ServiceConnection

    manifests: |
      k8s/deployment.yaml
      k8s/service.yaml

# Install kubectl
- task: KubectlInstaller@0
displayName: Install kubectl
  inputs:
    kubectlVersion: latest

# Deploy to AKS
- task: KubernetesManifest@1
  displayName: Deploy to AKS
  inputs:
    action: deploy
    kubernetesServiceConnection: AKS-ServiceConnection
    namespace: default
    manifests: |
      k8s/deployment.yaml
      k8s/service.yaml
    containers: |
      hiteshsingla02/ci-cd-demo:$(tag)