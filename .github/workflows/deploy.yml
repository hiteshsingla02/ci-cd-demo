name: Build and Deploy Employee API

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Verify .NET installation
      - name: Display .NET Version
        run: dotnet --version

      # Restore NuGet packages
      - name: Restore Dependencies
        run: dotnet restore

      # Build the application
      - name: Build Application
        run: dotnet build --configuration Release --no-restore

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t hiteshsingla02/ci-cd-demo:${{ github.sha }} \
            -t hiteshsingla02/ci-cd-demo:latest .

      # Push Docker images
      - name: Push Docker Images
        run: |
          docker push hiteshsingla02/ci-cd-demo:${{ github.sha }}
          docker push hiteshsingla02/ci-cd-demo:latest

      # Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Download AKS credentials
      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group rg-cicd-demo \
            --name aks-cicd-demo \
            --overwrite-existing

      # Verify AKS connection
      - name: Verify AKS Connection
        run: |
          kubectl get nodes

      # Update the deployment to use the newly built image
      - name: Deploy Latest Image to AKS
        run: |
          kubectl set image deployment/ci-cd-demo \
            ci-cd-demo=hiteshsingla02/ci-cd-demo:${{ github.sha }}

      # Wait until the rollout completes
      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/ci-cd-demo

      # Verify deployment
      - name: Verify Deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services